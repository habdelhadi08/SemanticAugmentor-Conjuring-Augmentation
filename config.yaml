# -----------------------------
# Augmentation settings
# -----------------------------
augmentation:
  synonym:
    aug_p: 0.3          # Probability for synonym replacement
  random_swap:
    aug_p: 0.2          # Probability for random word swap

# -----------------------------
# Embedding model
# -----------------------------
embedding:
  model_name: "paraphrase-MiniLM-L6-v2"

# -----------------------------
# FAISS settings
# -----------------------------
faiss:
  index_file: "data/faiss_index.index"
  metadata_file: "data/faiss_metadata.pkl"

# -----------------------------
# File paths
# -----------------------------
data:
  input_csv: "data/text.csv"
  augmented_csv: "data/augmented_text.csv"

# -----------------------------
# Experiment parameters
# -----------------------------
experiment:
  top_k: 5
  random_seed: 42

